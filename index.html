<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BU Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f7f4ef;--bg2:#efe9e0;--panel:#fffdfa;--panel2:#faf6f0;
 --ink:#1f1d1a;--ink2:#3c3832;--muted:#73695d;--line:#e4dcd0;--line2:#d6cabb;
 --accent:#a3231b;--accent2:#c7673b;--accent-ink:#fff;--accent-soft:#f7e9e5;
 --ok:#2d6a4a;--ok-bg:#e2f0e6;--warn:#8a6210;--warn-bg:#fbefd4;--bad:#a3231b;--bad-bg:#fae6e3;--idle:#857c70;--idle-bg:#eee8e0;
 --shadow:0 1px 2px rgba(60,45,30,.07),0 4px 14px -6px rgba(60,45,30,.10);
 --shadow2:0 2px 6px rgba(60,45,30,.10),0 10px 26px -10px rgba(60,45,30,.18);
 --r:14px;
 --display:"Fraunces",ui-serif,Georgia,"Iowan Old Style",serif;
 --sans:"Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 --ink3:#5c5449}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#17161a;--bg2:#121114;--panel:#211f24;--panel2:#272429;
 --ink:#f2eee9;--ink2:#ddd6cd;--muted:#a49a8e;--line:#36323a;--line2:#474150;
 --accent:#ef6a5c;--accent2:#e09a5f;--accent-ink:#1a1419;--accent-soft:#36242a;
 --ok:#71c793;--ok-bg:#1b3328;--warn:#e2b45c;--warn-bg:#3a2d14;--bad:#f3897e;--bad-bg:#3e2020;--idle:#978d81;--idle-bg:#2d2a30;
 --shadow:0 1px 2px rgba(0,0,0,.4);--shadow2:0 6px 22px -8px rgba(0,0,0,.6);--ink3:#b9b0a5}}
:root[data-theme="dark"]{--bg:#17161a;--bg2:#121114;--panel:#211f24;--panel2:#272429;--ink:#f2eee9;--ink2:#ddd6cd;--muted:#a49a8e;--line:#36323a;--line2:#474150;--accent:#ef6a5c;--accent2:#e09a5f;--accent-ink:#1a1419;--accent-soft:#36242a;--ok:#71c793;--ok-bg:#1b3328;--warn:#e2b45c;--warn-bg:#3a2d14;--bad:#f3897e;--bad-bg:#3e2020;--idle:#978d81;--idle-bg:#2d2a30;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow2:0 6px 22px -8px rgba(0,0,0,.6);--ink3:#b9b0a5}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:15px/1.58 var(--sans);
 background:
  radial-gradient(1200px 560px at 6% -10%,var(--accent-soft) 0%,transparent 60%),
  radial-gradient(1000px 520px at 102% 2%,color-mix(in srgb,var(--accent2) 16%,transparent) 0%,transparent 58%),
  radial-gradient(700px 400px at 50% 102%,var(--bg2) 0%,transparent 62%),
  var(--bg);
 background-attachment:fixed;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 72px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:22px 0 12px}
.brand{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:50% 50% 50% 8px;flex:none;rotate:-8deg;
 background:linear-gradient(145deg,var(--accent) 0%,var(--accent2) 100%);
 box-shadow:0 2px 6px -1px color-mix(in srgb,var(--accent) 45%,transparent)}
.brand span.a{color:var(--accent)}
.branches{display:inline-flex;gap:3px;padding:3px;background:color-mix(in srgb,var(--panel) 80%,var(--bg));
 border:1px solid var(--line);border-radius:999px;box-shadow:inset 0 1px 3px rgba(0,0,0,.05)}
.branches button{font:inherit;font-weight:600;font-size:13.5px;border:0;background:none;color:var(--muted);
 border-radius:999px;padding:6px 16px;cursor:pointer;transition:background .18s,color .18s,box-shadow .18s}
.branches button:hover{color:var(--ink)}
.branches button[aria-selected="true"]{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
body[data-branch="lab"]{--accent:#1d5f73;--accent2:#49a3a8;--accent-soft:#e0f0f2}
body[data-branch="lab"][data-tab="lgrants"]{--accent:#8a5a12;--accent2:#c69340;--accent-soft:#faeed8}
body[data-branch="lab"][data-tab="lirb"]{--accent:#7a3b86;--accent2:#b06ab0;--accent-soft:#f2e7f4}
body[data-branch="lab"][data-tab="lsheets"]{--accent:#1d5f73;--accent2:#49a3a8;--accent-soft:#e0f0f2}
body[data-branch="lab"][data-tab="lrecipes"]{--accent:#1f5f52;--accent2:#4d9c7a;--accent-soft:#e2f0ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 body[data-branch="lab"]{--accent:#6cc3d8;--accent2:#9ad9df;--accent-soft:#17303a}}}
.sync{margin-left:auto;font-size:12px;color:var(--muted);padding:3px 10px;border-radius:999px}
.sync:not(:empty){background:var(--panel);border:1px solid var(--line)}
.sync.bad{color:var(--bad);font-weight:600;border-color:var(--bad)}

/* main tabs: soft raised buttons, draggable */
nav.tabs{display:flex;gap:7px;overflow-x:auto;padding:5px 2px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
nav.tabs button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 17px;font:inherit;font-weight:500;
 color:var(--muted);cursor:grab;white-space:nowrap;box-shadow:var(--shadow);transition:transform .14s ease,box-shadow .14s ease,color .14s,background .14s,border-color .14s}
nav.tabs button:hover{color:var(--ink);transform:translateY(-1px);box-shadow:var(--shadow2);border-color:var(--line2)}
nav.tabs button[aria-selected="true"]{background:linear-gradient(160deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 78%,var(--accent2)) 100%);
 color:var(--accent-ink);border-color:transparent;font-weight:650;box-shadow:0 2px 10px -2px color-mix(in srgb,var(--accent) 55%,transparent)}
nav.tabs button:active{cursor:grabbing}
nav.tabs button.dragging{opacity:.45;transform:scale(.96)}
nav.tabs button.dropping{outline:2px dashed var(--accent);outline-offset:2px}

h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:11px;margin:0 0 9px;color:var(--muted);text-transform:uppercase;letter-spacing:.11em;font-weight:700}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px 18px;box-shadow:var(--shadow)}
.grid.g4>.card.stat{transition:transform .14s ease,box-shadow .14s ease}
.grid.g4>.card.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.stat{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.02;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
 background:linear-gradient(170deg,var(--panel) 0%,var(--panel2) 100%)}
.stat small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:6px;letter-spacing:.01em}
.stat.bad{color:var(--bad)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 14px;max-width:70ch}
button.btn,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 13px;cursor:pointer;
 box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,border-color .12s}
button.btn:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--shadow2)}
button.btn:active{transform:translateY(0)}
button.primary{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 80%,var(--accent2)));color:var(--accent-ink);border-color:transparent;font-weight:600}
button.link{background:none;border:0;color:var(--accent);padding:0;font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;box-shadow:none}
button.link:hover{text-decoration-thickness:2px;transform:none;box-shadow:none}
button.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px;box-shadow:none}
a{color:var(--accent);text-underline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;max-width:100%;transition:border-color .12s,box-shadow .12s}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
textarea{width:100%;min-height:72px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);outline:none}
button:focus-visible,a:focus-visible,[role=tab]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:block;font-size:11.5px;color:var(--muted);margin-bottom:12px;font-weight:500}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px;font-size:15px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:650;white-space:nowrap;letter-spacing:.01em}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-idle{background:var(--idle-bg);color:var(--idle)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%}
th button.sorth{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-align:left;box-shadow:none}
th button.sorth:hover{color:var(--ink);transform:none;box-shadow:none}
th button.sorth .ar{font-size:9px;opacity:.9}
th[aria-sort="none"] button.sorth .ar{opacity:0}
th button.sorth:hover .ar{opacity:.45}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{background:linear-gradient(var(--panel2),color-mix(in srgb,var(--panel2) 80%,var(--bg)));font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;z-index:1}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--panel2)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 16px}
.subtabs button{font:inherit;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap;
 box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,color .12s,background .12s}
.subtabs button:hover{color:var(--ink);transform:translateY(-1px);box-shadow:var(--shadow2)}
.subtabs button[aria-selected="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 38%,transparent);color:var(--accent);font-weight:650}
.subtabs .sep{width:1px;background:var(--line);margin:2px}
.skip{position:absolute;left:-9999px;top:0;background:var(--panel);color:var(--ink);border:1px solid var(--accent);border-radius:9px;padding:9px 13px;z-index:50}
.skip:focus{left:10px;top:10px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.empty{padding:30px;color:var(--muted);text-align:center;font-size:13.5px;font-family:var(--display);font-size:15px}
.dots{display:flex;gap:4px}
.dot{width:12px;height:12px;border-radius:4px;background:var(--idle-bg);display:inline-block}
.dot.prog{background:var(--warn)}.dot.done{background:var(--ok)}.dot.na{background:var(--line2)}
.bar{height:7px;background:var(--idle-bg);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:999px;transition:width .3s ease}
dialog{border:0;border-radius:16px;padding:0;max-width:820px;width:calc(100% - 28px);background:var(--panel);color:var(--ink);box-shadow:0 24px 60px -16px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(25,18,12,.5);backdrop-filter:blur(2px)}
.dlg{padding:22px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.qa{margin:0 0 13px}.qa .q{font-size:11.5px;color:var(--muted);margin-bottom:3px;font-weight:600;letter-spacing:.02em}
.qa .a{white-space:pre-wrap;overflow-wrap:anywhere}
.qa .a.none{color:var(--muted);font-style:italic}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.sec h3{margin-top:0;color:var(--accent)}
.dlg h2{font-family:var(--display);font-size:23px}
ol.steps{margin:0 0 14px;padding-left:22px}
ol.steps li{margin:0 0 8px;color:var(--ink2)}
.promptbox{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.5;
 background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px 15px;max-height:320px;overflow:auto;color:var(--ink2)}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rate{display:inline-block;min-width:22px;text-align:center;padding:1px 6px;border-radius:7px;font-weight:700;font-size:12px;background:var(--idle-bg);color:var(--idle)}
.rate.r1{background:var(--bad-bg);color:var(--bad)}.rate.r2{background:var(--warn-bg);color:var(--warn)}
.rate.r3,.rate.r4{background:var(--ok-bg);color:var(--ok)}
.stack{display:flex;height:9px;border-radius:999px;overflow:hidden;min-width:110px;background:var(--idle-bg)}
.stack i{display:block;height:100%}
.flag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:650;border:1px solid currentColor;margin-left:7px;vertical-align:1px}
.flag.medium{color:var(--warn)}
.facard .flag{font-family:var(--sans);font-size:10px;vertical-align:3px}.flag.low{color:var(--bad)}.flag.high{display:none}.flag.confirmed{color:var(--ok)}
.hb{max-width:74ch;font-size:15px;line-height:1.68}
.hb h4{font-family:var(--display);font-size:21px;font-weight:600;margin:26px 0 10px;text-transform:none;letter-spacing:-.01em;color:var(--ink);
 padding-bottom:7px;border-bottom:2px solid var(--accent-soft)}
.hb h4:first-child{margin-top:4px}
.hb h5.hbh{font-family:var(--display);font-size:16px;font-weight:600;margin:20px 0 6px;color:var(--accent);text-transform:none;letter-spacing:0}
.hb p{margin:0 0 13px;color:var(--ink2)}
.hb ul{margin:0 0 14px;padding-left:20px}
.hb li{margin:0 0 9px;color:var(--ink2)}
.hb li .mk{color:var(--accent);font-weight:700;margin-right:3px}
.hb li>span{display:inline}
.hb pre{white-space:pre-wrap;font-family:inherit;margin:0 0 11px;font-size:14px;color:var(--ink2)}
.hb details{margin:0 0 6px}
.hb .courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:6px 14px;margin:0 0 16px;
 padding:14px 16px;background:var(--panel2);border-radius:11px;border:1px solid var(--line)}
.hb .course{font-size:13.5px;color:var(--ink2)}
.hb .lines{margin:0 0 14px;padding:12px 15px;background:var(--panel2);border-radius:11px;border:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--ink2)}
.facard h4.facname{font-family:var(--display);font-size:18px;font-weight:600;margin:0;text-transform:none;letter-spacing:-.01em;color:var(--ink)}
.facard .row a{font-size:12.5px}
.facard details summary{font-weight:600;color:var(--accent);padding:4px 0}
mark{background:color-mix(in srgb,var(--accent2) 35%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.org{display:grid;gap:12px}
.orgrow{display:flex;gap:11px;flex-wrap:wrap}
.orgbox{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 14px;min-width:180px;box-shadow:var(--shadow);
 border-left:3px solid var(--accent2);transition:transform .12s,box-shadow .12s}
.orgbox:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.orgbox b{display:block;font-size:14px}
.orgbox span{display:block;font-size:11.5px;color:var(--muted)}
.orggroup>h3{margin:16px 0 7px}
details>summary{cursor:pointer;border-radius:7px}
details>summary:hover{color:var(--accent)}
/* --- a bit of zazz --- */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
 background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 0);
 background-size:22px 22px;mask-image:radial-gradient(130% 90% at 50% 0%,#000 0%,transparent 72%)}
.wrap{position:relative;z-index:1}
/* each tab gets its own hue, so the page changes temperature as you move around */
body[data-tab="overview"]{--accent:#a3231b;--accent2:#c7673b;--accent-soft:#f8e8e3}
body[data-tab="people"]{--accent:#1f5f52;--accent2:#4d9c7a;--accent-soft:#e2f0ea}
body[data-tab="reviews"]{--accent:#7a3b86;--accent2:#b06ab0;--accent-soft:#f2e7f4}
body[data-tab="funding"]{--accent:#8a5a12;--accent2:#c69340;--accent-soft:#faeed8}
body[data-tab="program"]{--accent:#1d4f73;--accent2:#5390b3;--accent-soft:#e3eef5}
body[data-tab="tools"]{--accent:#5a4a8a;--accent2:#8d7ac0;--accent-soft:#ebe7f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-tab="people"],body[data-tab="people"]{--accent:#67c6a6;--accent2:#9fd9bf;--accent-soft:#1b3630}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 body[data-tab="overview"]{--accent:#ef6a5c;--accent2:#e09a5f;--accent-soft:#36242a}
 body[data-tab="people"]{--accent:#6cc9a4;--accent2:#9ad9c0;--accent-soft:#17332b}
 body[data-tab="reviews"]{--accent:#c694d8;--accent2:#dcb6e6;--accent-soft:#2e2136}
 body[data-tab="funding"]{--accent:#e2b45c;--accent2:#edd09a;--accent-soft:#352a16}
 body[data-tab="program"]{--accent:#78b4da;--accent2:#aad3ea;--accent-soft:#1a2b38}
 body[data-tab="tools"]{--accent:#a596e0;--accent2:#c6bbee;--accent-soft:#272143}}}
body{transition:--accent .4s}
.brand .mark{animation:wob 9s ease-in-out infinite}
@keyframes wob{0%,100%{border-radius:50% 50% 50% 8px;rotate:-8deg}33%{border-radius:50% 8px 50% 50%;rotate:6deg}66%{border-radius:8px 50% 50% 50%;rotate:-3deg}}
.brand:hover .mark{animation-duration:2.2s}
main{animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.grid.g4>.card.stat{position:relative;overflow:hidden}
.grid.g4>.card.stat::after{content:"";position:absolute;right:-22px;top:-22px;width:76px;height:76px;border-radius:50%;
 background:radial-gradient(circle,color-mix(in srgb,var(--accent) 20%,transparent),transparent 68%);transition:transform .35s ease}
.grid.g4>.card.stat:hover::after{transform:scale(1.5) translate(-6px,6px)}
.card{position:relative}
.sec{position:relative}
.sec::before{content:"";position:absolute;left:0;top:-1px;width:42px;height:2px;background:var(--accent);border-radius:2px}
nav.tabs button[aria-selected="true"]{animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.93)}to{transform:none}}
.badge{transition:transform .14s}
.badge:hover{transform:scale(1.07)}
.bar i{background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 8px -2px var(--accent)}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.empty::before{content:"◠‿◠";display:block;font-size:20px;color:var(--accent);opacity:.4;margin-bottom:8px;letter-spacing:2px}
.hb h4{border-bottom-color:color-mix(in srgb,var(--accent) 28%,transparent)}
.facard{transition:transform .16s ease,box-shadow .16s ease}
.facard:hover{transform:translateY(-3px);box-shadow:var(--shadow2)}
.facard::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;

<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap" id="app"></div>
<script>
"use strict";
var ENDPOINT = "https://script.google.com/macros/s/AKfycbzEvyhVxuqA9G0w4c9gyUHHB9JDqtDa3fqZFyhNc6G5taf9oS3BWKQzsQPXj0qCFhIN/exec";
var KEY = null;
try { KEY = localStorage.getItem("ddkey"); } catch (e) {}
var S = {students: [], tasks: [], notes: [], config: {milestones: []}, report: {}, reviews: null};
var UI = {tab: "overview", q: "", sf: "active", taskFilter: "open", noteStudent: "", sheetId: "", branch: "dir"};
try { UI.branch = localStorage.getItem("ddbranch") || "dir"; } catch (e) {}
try { UI.tab = UI.branch === "lab" ? "lhome" : "overview"; } catch (e) {}
var app = document.getElementById("app");

/* ---------- helpers ---------- */
function h(tag, attrs) {
  var el = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs) {
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "text") el.textContent = v;
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;

  return el;
}
function add(el, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) c.forEach(function (x) { add(el, x); });
  else el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
}
function isFilled(v) { return v != null && String(v).trim() !== ""; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function todayStr() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function daysFrom(s) { if (!s) return null; var a = new Date(s + "T00:00:00"), b = new Date(todayStr() + "T00:00:00"); return Math.round((a - b) / 86400000); }
function fmtDate(s) {
  if (!s) return "";
  var d = s.length <= 10 ? new Date(s + "T00:00:00") : new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString(undefined, {month: "short", day: "numeric", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric"});
}
function ayStart(d) { d = d || new Date(); return d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1; }
function ayLabel() { var a = ayStart(); return a + "–" + String(a + 1).slice(2); }
/* Year in the program, counted from the entry academic year. Year 1 is the year they arrived. */
function progYear(st) {
  var m = /(\d{4})/.exec(st && st.cohort || "");
  if (!m) return null;
  var y = ayStart() - Number(m[1]) + 1;
  return y >= 1 && y < 15 ? y : null;
}
function yearCell(st) {
  var y = progYear(st);
  return h("td", {class: y == null ? "muted" : "", text: y == null ? "—" : String(y), title: y == null ? "Set the entry year on the student" : "Entered " + st.cohort});
}
/* A CV's "freshness" has three candidate dates and they often disagree.
   Content is what actually matters, so prefer it, then the file date, then the server header. */
function parseLoose(v) {
  v = String(v || "").trim(); if (!v) return null;
  var m = /(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(v);
  if (m) return new Date(+m[1], +m[2] - 1, +(m[3] || 15));
  m = /(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(\d{4})/i.exec(v);
  if (m) return new Date(+m[2], "janfebmaraprmayjunjulaugsepoctnovdec".indexOf(m[1].slice(0, 3).toLowerCase()) / 3, 15);
  m = /\b(19|20)\d{2}\b/.exec(v);
  if (m) return new Date(+m[0], 11, 31);   // a bare year: assume end of year, the kindest reading
  var d = new Date(v); return isNaN(d) ? null : d;
}
function cvBest(cv) {
  if (!cv || !cv.url) return null;
  var tries = [["content", cv.contentDate], ["file", cv.docDate], ["server", cv.lastModified]];
  for (var i = 0; i < tries.length; i++) { var d = parseLoose(tries[i][1]); if (d) return {d: d, src: tries[i][0], raw: tries[i][1]}; }
  return null;
}
function monthsAgo(d) { return d ? Math.max(0, Math.round((Date.now() - d.getTime()) / 2629800000)) : null; }
function cvBadge(cv) {
  if (!cv || !cv.url) return badge("No CV", "idle");
  var b = cvBest(cv); if (!b) return badge("Undated", "warn");
  var m = monthsAgo(b.d);
  var kind = m <= 12 ? "ok" : m <= 24 ? "warn" : "bad";
  var lab = m < 1 ? "This month" : m < 12 ? m + " mo" : (m / 12).toFixed(m % 12 ? 1 : 0) + " yr";
  return badge(lab, kind);
}
function cvCell(st) {
  var cv = st.cv, td = h("td", {class: "small"});
  if (!cv || !cv.url) { td.appendChild(badge("None", "idle")); return td; }
  var b = cvBest(cv);
  td.appendChild(h("a", {href: cv.url, target: "_blank", rel: "noopener", text: "CV", title: cv.url, onclick: function (e) { e.stopPropagation(); }}));
  td.appendChild(h("span", {text: " "}));
  td.appendChild(cvBadge(cv));
  if (b) td.appendChild(h("div", {class: "small muted", text: (b.src === "content" ? "latest entry " : b.src === "file" ? "file saved " : "server ") + b.raw}));
  return td;
}
var CMTE = [["adv", "Advisory committee"], ["pros", "Prospectus committee"], ["diss", "Dissertation committee"]];
function cmteOf(st, k) { return ((st && st.cmte) || {})[k] || []; }
function cmteAll(st) {
  var seen = {}, out = [];
  CMTE.forEach(function (c) { cmteOf(st, c[0]).forEach(function (n) { if (!seen[n]) { seen[n] = 1; out.push(n); } }); });
  return out;
}
/* Everyone who shows up as an advisor or on any committee — used for the datalist and the service-load view. */
function facultyPool() {
  var seen = {};
  S.students.forEach(function (st) {
    if (st.advisor) seen[st.advisor] = 1;
    cmteAll(st).forEach(function (n) { seen[n] = 1; });
  });
  if (S.archive) S.archive.records.forEach(function (r) { (r.committee || []).forEach(function (n) { seen[n] = 1; }); if (r.advisor) seen[r.advisor] = 1; });
  return Object.keys(seen).filter(Boolean).sort();
}
function studentById(id) { return S.students.filter(function (s) { return s.id === id; })[0]; }
function badge(text, kind) { return h("span", {class: "badge b-" + kind, text: text}); }
function copy(text, msg) {
  function ok() { setSync(msg || "Copied", false); setTimeout(function () { setSync("", false); }, 1800); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, function () { prompt("Copy:", text); });
  else prompt("Copy:", text);
}
function msList() { return (S.config && S.config.milestones) || []; }
function msState(st, k) { return ((st.ms || {})[k] || {}).s || "todo"; }
function progress(st) {
  var list = msList().filter(function (m) { return msState(st, m.k) !== "na"; });
  if (!list.length) return 0;
  return Math.round(100 * list.filter(function (m) { return msState(st, m.k) === "done"; }).length / list.length);
}

/* ---------- api / saving ---------- */
var pending = 0, chain = {}, syncMsg = "", syncBad = false;
function setSync(msg, bad) {
  syncMsg = msg; syncBad = !!bad;
  var el = document.getElementById("sync");
  if (el) { el.textContent = msg; el.className = "sync" + (bad ? " bad" : ""); }
}
function call(action, data) {
  var body = JSON.stringify(Object.assign({key: KEY, action: action}, data || {}));
  return fetch(ENDPOINT, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: body}).then(function (r) { return r.json(); });
}
function persist(coll, obj, tries) {
  tries = tries || 0;
  return call("put", {coll: coll, obj: obj}).then(function (r) {
    if (r && r.ok) return;
    if (r && r.error === "auth") { signOut("That key no longer works."); return; }
    throw new Error((r && r.error) || "fail");
  }).catch(function () {
    if (tries >= 4) { setSync("Could not save. Check connection, then reload.", true); return; }
    setSync("Retrying save…", true);
    return new Promise(function (res) { setTimeout(res, 3000); }).then(function () { return persist(coll, obj, tries + 1); });
  });
}
function save(coll, obj) {
  if (obj && !obj.branch) obj.branch = coll === "tasks" ? (obj.branch || "dir") : "dir";
  if (!obj.id) obj.id = uid();
  var list = S[coll];
  if (Array.isArray(list) && !list.some(function (x) { return x.id === obj.id; })) list.push(obj);
  var key = coll + "|" + obj.id;
  pending++; setSync("Saving…", false);
  var snapshot = JSON.parse(JSON.stringify(obj));
  chain[key] = (chain[key] || Promise.resolve()).then(function () { return persist(coll, snapshot); }).then(function () {
    pending--; if (!pending) { setSync("Saved", false); setTimeout(function () { if (!pending) setSync("", false); }, 1500); }
  });
  return obj;
}
function saveConfig() { S.config.id = "main"; save("config", S.config); }
function remove(coll, id) {
  S[coll] = S[coll].filter(function (x) { return x.id !== id; });
  pending++; setSync("Saving…", false);
  var key = coll + "|" + id;
  chain[key] = (chain[key] || Promise.resolve()).then(function () { return call("del", {coll: coll, id: id}); }).then(function () {
    pending--; if (!pending) { setSync("Saved", false); setTimeout(function () { if (!pending) setSync("", false); }, 1500); }
  }).catch(function () { pending--; setSync("Delete may not have saved. Reload to check.", true); });
}
var timers = {};
function saveSoon(coll, obj) {
  var k = coll + "|" + obj.id;
  clearTimeout(timers[k]);
  setSync("Editing…", false);
  timers[k] = setTimeout(function () { save(coll, obj); }, 700);
}

/* ---------- boot ---------- */
function signOut(msg) { try { localStorage.removeItem("ddkey"); } catch (e) {} KEY = null; gate(msg); }
function gate(msg) {
  app.textContent = "";
  var inp = h("input", {type: "password", placeholder: "Director key", autocomplete: "off", "aria-label": "Director key"});
  function go() { var v = inp.value.trim(); if (!v) return; KEY = v; try { localStorage.setItem("ddkey", v); } catch (e) {} boot(); }
  inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
  app.appendChild(h("div", {class: "gate card"},
    h("div", {class: "brand"}, h("span", {class: "mark", "aria-hidden": "true"}), "BBC ", h("span", {class: "a", text: "Director"}), " Dashboard"),
    h("p", {class: "muted", text: msg || "Enter your director key to open the dashboard."}), inp,
    h("button", {class: "btn primary", onclick: go, text: "Open"})));

function boot() {
  var m = location.hash.slice(1);

  if (!KEY) return gate();

  app.appendChild(h("p", {class: "muted", style: "padding:40px 0;text-align:center", text: "Loading…"}));
  loadAll(true);

function loadAll(first) {
  return call("load").then(function (r) {
    if (!r || !r.ok) {
      if (r && r.error === "auth") return signOut("That key didn't work. Paste it again.");
      throw new Error("load");
    }
    S.students = r.data.students; S.tasks = r.data.tasks; S.notes = r.data.notes;
    S.config = r.data.config || {milestones: []}; S.report = r.report || {}; UI.sheetId = r.sheetId || "";
    S.students.sort(function (a, b) { return a.name.localeCompare(b.name); });
    render();
  }).catch(function () {
    if (!first) { setSync("Could not refresh.", true); return; }
    app.textContent = "";
    app.appendChild(h("div", {class: "gate card"}, h("p", {text: "Couldn't reach the server."}), h("button", {class: "btn primary", onclick: boot, text: "Try again"})));
  });
}

/* ---------- shell ---------- */
var BRANCHES = [["lab", "Lab"], ["dir", "Director"]];
var TABSETS = {
  dir: [["overview", "Overview"], ["people", "People"], ["reviews", "Annual Report"], ["funding", "Funding"], ["program", "Program"], ["tools", "Tools"]],
  lab: [["lhome", "Overview"], ["lpeople", "Lab"], ["lgrants", "Grants"], ["lirb", "Compliance"], ["ladmin", "Admin"], ["lsheets", "Sheets"], ["lrecipes", "Shortcuts"]]
};
function branch() { return UI.branch === "lab" ? "lab" : "dir"; }
function TABSET() { return TABSETS[branch()]; }
var TABS = TABSETS.dir;
/* The person can drag tabs into the order they like; it is remembered per device. */
function tabOrder() {
  var set = TABSET(), saved = [];
  try { saved = JSON.parse(localStorage.getItem("ddtabs:" + branch()) || "[]"); } catch (e) {}
  var ids = set.map(function (t) { return t[0]; });
  var out = saved.filter(function (x) { return ids.indexOf(x) >= 0; });
  ids.forEach(function (x) { if (out.indexOf(x) < 0) out.push(x); });
  return out.map(function (id) { return set.filter(function (t) { return t[0] === id; })[0]; });
}
function saveTabOrder(ids) { try { localStorage.setItem("ddtabs:" + branch(), JSON.stringify(ids)); } catch (e) {} }
function setBranch(b) {
  UI.branch = b;
  try { localStorage.setItem("ddbranch", b); } catch (e) {}
  var set = TABSETS[b], ids = set.map(function (t) { return t[0]; });
  if (ids.indexOf(UI.tab) < 0) UI.tab = tabOrder()[0][0];
  render();
}
var VIEWS = {overview: vHome, reviews: vReviews, funding: vFunding, people: vPeople, program: vProgram, tools: vTools,
  lhome: vLabHome, lpeople: vLabPeople, lgrants: vGrants, lirb: vCompliance, ladmin: vAdmin, lrecipes: vRecipes,
  lsheets: function () { return vSheets("lab"); }};

/* Roving-tabindex keyboard navigation shared by the main tabs and every subtab row. */
function wireTablist(el) {

    b.addEventListener("keydown", function (e) {

      var j = e.key === "Home" ? 0 : e.key === "End" ? btns.length - 1 : n ? (i + n + btns.length) % btns.length : -1;

    });
  });

/* One subtab row, used by Annual Report, Funding and Program so they all behave alike. */

  items.forEach(function (it) {
    if (it === "|") { bar.appendChild(h("div", {class: "sep", "aria-hidden": "true"})); return; }

      onclick: function () { pick(it[0]); }}));

function isNarrow() { return window.matchMedia("(max-width:760px)").matches; }

/* ---------- click-to-sort for every table ---------- */

}
function sortable() {

      th.setAttribute("aria-sort", "none");
      th.textContent = "";
      var btn = h("button", {class: "sorth", type: "button", title: "Sort by " + label}, label, h("span", {class: "ar", "aria-hidden": "true", text: "▲"}));
      btn.addEventListener("click", function () {

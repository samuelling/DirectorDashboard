<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BBC Director Dashboard</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1c1b19;--muted:#6b6862;--line:#e3e0d9;--accent:#b3261e;--accent-ink:#fff;--ok:#2e7d4f;--ok-bg:#e3f2e8;--warn:#9a6700;--warn-bg:#fbf0d0;--bad:#b3261e;--bad-bg:#fbe3e1;--idle:#8a867e;--idle-bg:#eceae5;--shadow:0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--panel:#211f1d;--ink:#f0ede7;--muted:#a09b92;--line:#35322e;--accent:#e8574e;--accent-ink:#171614;--ok:#6cc18a;--ok-bg:#1d3326;--warn:#e0b04c;--warn-bg:#3a2f14;--bad:#f08a83;--bad-bg:#3e1f1c;--idle:#9a958c;--idle-bg:#2e2b28}}
:root[data-theme="dark"]{--bg:#171614;--panel:#211f1d;--ink:#f0ede7;--muted:#a09b92;--line:#35322e;--accent:#e8574e;--accent-ink:#171614;--ok:#6cc18a;--ok-bg:#1d3326;--warn:#e0b04c;--warn-bg:#3a2f14;--bad:#f08a83;--bad-bg:#3e1f1c;--idle:#9a958c;--idle-bg:#2e2b28}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 64px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0 8px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.sync{margin-left:auto;font-size:12px;color:var(--muted)}
.sync.bad{color:var(--bad);font-weight:600}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;-webkit-overflow-scrolling:touch}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font:inherit;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.stat{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:4px}
.stat.bad{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12px}
button.btn,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.btn:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.link{background:none;border:0;color:var(--accent);padding:0;font:inherit;cursor:pointer;text-decoration:underline}
button.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:3px;font-size:15px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-idle{background:var(--idle-bg);color:var(--idle)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.dots{display:flex;gap:4px}
.dot{width:14px;height:14px;border-radius:4px;background:var(--idle-bg);border:1px solid var(--line)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.prog{background:var(--warn);border-color:var(--warn)}
.dot.na{opacity:.35;background:transparent;border-style:dashed}
.bar{height:6px;border-radius:3px;background:var(--idle-bg);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--ok)}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .t{flex:1;min-width:0}
.task .t b{font-weight:500;overflow-wrap:anywhere}
.task.done .t b{text-decoration:line-through;color:var(--muted)}
.note{padding:10px 0;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note p{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:16px;overflow-y:auto;max-height:calc(100vh - 28px)}
.ms{display:grid;grid-template-columns:1fr 120px 140px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ms .mn{grid-column:1/-1}
@media(min-width:620px){.ms{grid-template-columns:1fr 120px 140px 1.2fr}.ms .mn{grid-column:auto}}
.gate{max-width:420px;margin:12vh auto;text-align:center}
.gate input{width:100%;margin:12px 0}
.empty{padding:18px;color:var(--muted);text-align:center}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.cols2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
var ENDPOINT = "https://script.google.com/macros/s/AKfycbzEvyhVxuqA9G0w4c9gyUHHB9JDqtDa3fqZFyhNc6G5taf9oS3BWKQzsQPXj0qCFhIN/exec";
var KEY = null;
try { KEY = localStorage.getItem("ddkey"); } catch (e) {}
var S = {students: [], tasks: [], notes: [], config: {milestones: []}, report: {}};
var UI = {tab: "overview", q: "", sf: "active", taskFilter: "open", noteStudent: "", sheetId: ""};
var app = document.getElementById("app");

/* ---------- helpers ---------- */
function h(tag, attrs) {
  var el = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs) {
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "text") el.textContent = v;
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) c.forEach(function (x) { add(el, x); });
  else el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function todayStr() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function daysFrom(s) { if (!s) return null; var a = new Date(s + "T00:00:00"), b = new Date(todayStr() + "T00:00:00"); return Math.round((a - b) / 86400000); }
function fmtDate(s) {
  if (!s) return "";
  var d = s.length <= 10 ? new Date(s + "T00:00:00") : new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString(undefined, {month: "short", day: "numeric", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric"});
}
function studentById(id) { return S.students.filter(function (s) { return s.id === id; })[0]; }
function badge(text, kind) { return h("span", {class: "badge b-" + kind, text: text}); }
function copy(text, msg) {
  function ok() { setSync(msg || "Copied", false); setTimeout(function () { setSync("", false); }, 1800); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, function () { prompt("Copy:", text); });
  else prompt("Copy:", text);
}
function msList() { return (S.config && S.config.milestones) || []; }
function msState(st, k) { return ((st.ms || {})[k] || {}).s || "todo"; }
function progress(st) {
  var list = msList().filter(function (m) { return msState(st, m.k) !== "na"; });
  if (!list.length) return 0;
  return Math.round(100 * list.filter(function (m) { return msState(st, m.k) === "done"; }).length / list.length);
}

/* ---------- api / saving ---------- */
var pending = 0, chain = {}, syncMsg = "", syncBad = false;
function setSync(msg, bad) {
  syncMsg = msg; syncBad = !!bad;
  var el = document.getElementById("sync");
  if (el) { el.textContent = msg; el.className = "sync" + (bad ? " bad" : ""); }
}
function call(action, data) {
  var body = JSON.stringify(Object.assign({key: KEY, action: action}, data || {}));
  return fetch(ENDPOINT, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: body}).then(function (r) { return r.json(); });
}
function persist(coll, obj, tries) {
  tries = tries || 0;
  return call("put", {coll: coll, obj: obj}).then(function (r) {
    if (r && r.ok) return;
    if (r && r.error === "auth") { signOut("That key no longer works."); return; }
    throw new Error((r && r.error) || "fail");
  }).catch(function () {
    if (tries >= 4) { setSync("Could not save. Check connection, then reload.", true); return; }
    setSync("Retrying save…", true);
    return new Promise(function (res) { setTimeout(res, 3000); }).then(function () { return persist(coll, obj, tries + 1); });
  });
}
function save(coll, obj) {
  if (!obj.id) obj.id = uid();
  var list = S[coll];
  if (Array.isArray(list) && !list.some(function (x) { return x.id === obj.id; })) list.push(obj);
  var key = coll + "|" + obj.id;
  pending++; setSync("Saving…", false);
  var snapshot = JSON.parse(JSON.stringify(obj));
  chain[key] = (chain[key] || Promise.resolve()).then(function () { return persist(coll, snapshot); }).then(function () {
    pending--; if (!pending) { setSync("Saved", false); setTimeout(function () { if (!pending) setSync("", false); }, 1500); }
  });
  return obj;
}
function saveConfig() { S.config.id = "main"; save("config", S.config); }
function remove(coll, id) {
  S[coll] = S[coll].filter(function (x) { return x.id !== id; });
  pending++; setSync("Saving…", false);
  var key = coll + "|" + id;
  chain[key] = (chain[key] || Promise.resolve()).then(function () { return call("del", {coll: coll, id: id}); }).then(function () {
    pending--; if (!pending) { setSync("Saved", false); setTimeout(function () { if (!pending) setSync("", false); }, 1500); }
  }).catch(function () { pending--; setSync("Delete may not have saved. Reload to check.", true); });
}
var timers = {};
function saveSoon(coll, obj) {
  var k = coll + "|" + obj.id;
  clearTimeout(timers[k]);
  setSync("Editing…", false);
  timers[k] = setTimeout(function () { save(coll, obj); }, 700);
}

/* ---------- boot ---------- */
function signOut(msg) { try { localStorage.removeItem("ddkey"); } catch (e) {} KEY = null; gate(msg); }
function gate(msg) {
  app.textContent = "";
  var inp = h("input", {type: "password", placeholder: "Director key", autocomplete: "off", "aria-label": "Director key"});
  function go() { var v = inp.value.trim(); if (!v) return; KEY = v; try { localStorage.setItem("ddkey", v); } catch (e) {} boot(); }
  inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
  app.appendChild(h("div", {class: "gate card"},
    h("div", {class: "brand"}, "BBC ", h("span", {text: "Director"}), " Dashboard"),
    h("p", {class: "muted", text: msg || "Enter your director key to open the dashboard."}), inp,
    h("button", {class: "btn primary", onclick: go, text: "Open"})));
  inp.focus();
}
function boot() {
  var m = location.hash.slice(1);
  if (m) { KEY = m; try { localStorage.setItem("ddkey", m); } catch (e) {} history.replaceState(null, "", location.pathname + location.search); }
  if (!KEY) return gate();
  app.textContent = "";
  app.appendChild(h("p", {class: "muted", style: "padding:40px 0;text-align:center", text: "Loading…"}));
  loadAll(true);
}
function loadAll(first) {
  return call("load").then(function (r) {
    if (!r || !r.ok) {
      if (r && r.error === "auth") return signOut("That key didn't work. Paste it again.");
      throw new Error("load");
    }
    S.students = r.data.students; S.tasks = r.data.tasks; S.notes = r.data.notes;
    S.config = r.data.config || {milestones: []}; S.report = r.report || {}; UI.sheetId = r.sheetId || "";
    S.students.sort(function (a, b) { return a.name.localeCompare(b.name); });
    render();
  }).catch(function () {
    if (!first) { setSync("Could not refresh.", true); return; }
    app.textContent = "";
    app.appendChild(h("div", {class: "gate card"}, h("p", {text: "Couldn't reach the server."}), h("button", {class: "btn primary", onclick: boot, text: "Try again"})));
  });
}

/* ---------- shell ---------- */
var TABS = [["overview", "Overview"], ["tasks", "Tasks"], ["students", "Students"], ["notes", "Notes"], ["report", "Annual report"], ["settings", "Settings"]];
function render() {
  var openDlg = document.querySelector("dialog[open]");
  if (openDlg) return; // don't clobber an open editor
  app.textContent = "";
  app.appendChild(h("header", {class: "top"},
    h("div", {class: "brand"}, "BBC ", h("span", {text: "Director"}), " Dashboard"),
    h("div", {id: "sync", class: "sync" + (syncBad ? " bad" : ""), text: syncMsg})));
  var nav = h("nav", {class: "tabs", role: "tablist"});
  TABS.forEach(function (t) {
    nav.appendChild(h("button", {role: "tab", "aria-selected": String(UI.tab === t[0]), text: t[1], onclick: function () { UI.tab = t[0]; render(); }}));
  });
  app.appendChild(nav);
  var view = {overview: vOverview, tasks: vTasks, students: vStudents, notes: vNotes, report: vReport, settings: vSettings}[UI.tab];
  app.appendChild(view());
}

/* ---------- overview ---------- */
function openTasks() { return S.tasks.filter(function (t) { return t.status !== "done"; }); }
function reportCounts() {
  var act = S.students.filter(function (s) { return s.status === "active"; }), c = {n: 0, sSub: 0, aSub: 0, sDraft: 0};
  act.forEach(function (s) { var r = S.report[s.id]; if (!r) return; c.n++; if (r.sSub) c.sSub++; else if (r.sDraft) c.sDraft++; if (r.aSub) c.aSub++; });
  return c;
}
function vOverview() {
  var ot = openTasks(), overdue = ot.filter(function (t) { var d = daysFrom(t.due); return d != null && d < 0; });
  var soon = ot.filter(function (t) { var d = daysFrom(t.due); return d != null && d >= 0 && d <= 14; });
  var rc = reportCounts(), flagged = S.students.filter(function (s) { return s.flag && s.status === "active"; });
  var act = S.students.filter(function (s) { return s.status === "active"; });
  var avg = act.length ? Math.round(act.reduce(function (a, s) { return a + progress(s); }, 0) / act.length) : 0;
  var root = h("div", {class: "grid"});
  root.appendChild(h("div", {class: "grid g4"},
    h("div", {class: "card stat" + (overdue.length ? " bad" : ""), text: String(overdue.length)}, h("small", {text: "Overdue tasks"})),
    h("div", {class: "card stat", text: String(soon.length)}, h("small", {text: "Due in 14 days"})),
    h("div", {class: "card stat", text: String(act.length)}, h("small", {text: "Active students"})),
    h("div", {class: "card stat", text: avg + "%"}, h("small", {text: "Avg milestone progress"})),
    h("div", {class: "card stat", text: rc.sSub + "/" + rc.n}, h("small", {text: "Student reports in"})),
    h("div", {class: "card stat", text: rc.aSub + "/" + rc.n}, h("small", {text: "Advisor reviews in"}))));
  var left = h("div", {class: "card"}, h("h3", {text: "Needs attention"}));
  var items = overdue.concat(soon);
  if (!items.length) left.appendChild(h("div", {class: "empty", text: "No overdue or upcoming tasks."}));
  items.slice(0, 8).forEach(function (t) { left.appendChild(taskRow(t, true)); });
  if (flagged.length) {
    left.appendChild(h("h3", {text: "Flagged students", style: "margin-top:14px"}));
    flagged.forEach(function (s) { left.appendChild(h("div", {class: "row", style: "padding:4px 0"}, h("button", {class: "link", text: s.name, onclick: function () { studentDlg(s); }}), h("span", {class: "muted small", text: s.advisor}))); });
  }
  var right = h("div", {class: "card"}, h("h3", {text: "Recent notes"}));
  var rn = S.notes.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || "") || (b.created || "").localeCompare(a.created || ""); }).slice(0, 6);
  if (!rn.length) right.appendChild(h("div", {class: "empty", text: "No notes yet."}));
  rn.forEach(function (n) { right.appendChild(noteRow(n)); });
  root.appendChild(h("div", {class: "grid g2"}, left, right));
  return root;
}

/* ---------- tasks ---------- */
var CATS = ["Admissions", "Annual report", "Curriculum", "Funding", "Meetings", "Reporting", "Students", "Other"];
function taskRow(t, showStudent) {
  var d = daysFrom(t.due), st = t.status === "done";
  var due = t.due ? (st ? badge(fmtDate(t.due), "idle") : badge(d < 0 ? "Overdue " + fmtDate(t.due) : fmtDate(t.due), d < 0 ? "bad" : d <= 7 ? "warn" : "idle")) : null;
  var stu = t.studentId && studentById(t.studentId);
  return h("div", {class: "task" + (st ? " done" : "")},
    h("input", {type: "checkbox", checked: st, "aria-label": "Done", onchange: function (e) { t.status = e.target.checked ? "done" : "open"; t.doneAt = e.target.checked ? todayStr() : ""; save("tasks", t); render(); }}),
    h("div", {class: "t"}, h("b", {text: t.title}),
      h("div", {class: "small muted"}, [t.cat, stu && showStudent !== false ? stu.name : null, t.notes].filter(Boolean).join(" · "))),
    due, h("button", {class: "x", "aria-label": "Edit task", text: "✎", onclick: function () { taskDlg(t); }}));
}
function vTasks() {
  var root = h("div", {});
  var sel = h("select", {onchange: function (e) { UI.taskFilter = e.target.value; render(); }},
    [["open", "Open"], ["done", "Done"], ["all", "All"]].map(function (o) { return h("option", {value: o[0], text: o[1], selected: UI.taskFilter === o[0]}); }));
  root.appendChild(h("div", {class: "toolbar"}, sel, h("span", {class: "grow"}), h("button", {class: "btn primary", text: "+ New task", onclick: function () { taskDlg(null); }})));
  var list = S.tasks.filter(function (t) { return UI.taskFilter === "all" || (UI.taskFilter === "done") === (t.status === "done"); });
  list.sort(function (a, b) { return (a.due || "9999").localeCompare(b.due || "9999"); });
  var card = h("div", {class: "card"});
  if (!list.length) card.appendChild(h("div", {class: "empty", text: "Nothing here."}));
  list.forEach(function (t) { card.appendChild(taskRow(t)); });
  root.appendChild(card);
  return root;
}
function dialog(build) {
  var dlg = h("dialog", {});
  var inner = h("div", {class: "dlg"});
  dlg.appendChild(inner);
  function close() { dlg.close(); }
  build(inner, close);
  dlg.addEventListener("close", function () { dlg.remove(); render(); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });
  document.body.appendChild(dlg);
  dlg.showModal();
  return dlg;
}
function taskDlg(t, preset) {
  var isNew = !t; t = t || preset || {status: "open", cat: "Other", due: "", title: "", studentId: "", notes: ""};
  dialog(function (el, close) {
    var title = h("input", {value: t.title, placeholder: "What needs doing?"});
    var due = h("input", {type: "date", value: t.due});
    var cat = h("select", {}, CATS.map(function (c) { return h("option", {value: c, text: c, selected: t.cat === c}); }));
    var stu = h("select", {}, [h("option", {value: "", text: "None"})].concat(S.students.map(function (s) { return h("option", {value: s.id, text: s.name, selected: t.studentId === s.id}); })));
    var notes = h("textarea", {value: t.notes || ""});
    el.appendChild(h("h2", {text: isNew ? "New task" : "Edit task"}));
    el.appendChild(h("label", {class: "f"}, "Task", title));
    el.appendChild(h("div", {class: "cols2"}, h("label", {class: "f"}, "Due", due), h("label", {class: "f"}, "Category", cat)));
    el.appendChild(h("label", {class: "f"}, "Student (optional)", stu));
    el.appendChild(h("label", {class: "f"}, "Notes", notes));
    el.appendChild(h("div", {class: "row sp"},
